<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Sinh Nhật</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: #ffffff; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 25px; border-radius: 15px; text-align: center; margin-bottom: 25px; }
        .form-box { background: #f8fafc; padding: 20px; border-radius: 15px; margin-bottom: 25px; border: 2px solid #e2e8f0; display: grid; gap: 12px; }
        input { padding: 12px; border: 2px solid #cbd5e1; border-radius: 10px; }
        .btn-add { background: #ff7eb3; color: white; border: none; padding: 12px; border-radius: 10px; cursor: pointer; }
        .btn-delete { background: #fee2e2; color: #ef4444; border: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; }
        
        /* Style cho bảng Embed (Dialog) */
        dialog { border: none; border-radius: 15px; padding: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); width: 300px; }
        dialog input { width: 100%; margin-bottom: 10px; }
        dialog button { padding: 8px 15px; border-radius: 8px; border: none; cursor: pointer; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header"><h1>🎂 Quản Lý Sinh Nhật</h1></div>
        <form id="contactForm" class="form-box">
            <input type="hidden" id="editId">
            <input type="text" id="name" placeholder="👤 Tên" required>
            <input type="text" id="phone" placeholder="📞 Số điện thoại">
            <input type="date" id="dob" required>
            <button type="submit" class="btn-add">THÊM MỚI ✨</button>
        </form>
        <table id="contactTable" style="width:100%; border-collapse: collapse;">
            <thead><tr><th>Tên</th><th>SĐT</th><th>Ngày sinh</th><th>Hành động</th></tr></thead>
            <tbody id="contactTableBody"></tbody>
        </table>
    </div>

    <!-- Khung Embed xác nhận mật khẩu -->
    <dialog id="passwordDialog">
        <h3 style="margin-bottom:10px;">Xác nhận xóa</h3>
        <input type="password" id="passInput" placeholder="Nhập mật khẩu...">
        <div style="display:flex; justify-content: flex-end; gap: 10px;">
            <button onclick="closeDialog()">Hủy</button>
            <button style="background:#ef4444; color:white;" onclick="confirmDelete()">Xóa</button>
        </div>
    </dialog>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, set, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const db = getDatabase(initializeApp({databaseURL: "https://kkkk-efe87-default-rtdb.asia-southeast1.firebasedatabase.app"}));
        const contactsRef = ref(db, 'contacts');
        const dialog = document.getElementById('passwordDialog');
        let deleteId = null;

        onValue(contactsRef, (snapshot) => {
            const body = document.getElementById('contactTableBody');
            body.innerHTML = '';
            const data = snapshot.val() || {};
            Object.entries(data).forEach(([id, val]) => {
                body.innerHTML += `<tr><td>${val.name}</td><td>${val.phone}</td><td>${val.dob}</td>
                    <td><button class="btn-delete" onclick="openDialog('${id}')">Xóa</button></td></tr>`;
            });
        });

        // Hàm mở/đóng Embed
        window.openDialog = (id) => { deleteId = id; dialog.showModal(); }
        window.closeDialog = () => { dialog.close(); document.getElementById('passInput').value = ''; }

        // Hàm xóa sau khi kiểm tra
        window.confirmDelete = async () => {
            const pass = document.getElementById('passInput').value;
            if (pass === "1234567890") {
                await remove(ref(db, 'contacts/' + deleteId));
                closeDialog();
                alert("Đã xóa!");
            } else {
                alert("Mật khẩu sai!");
            }
        };

        document.getElementById('contactForm').addEventListener('submit', (e) => {
            e.preventDefault();
            push(contactsRef, {
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                dob: document.getElementById('dob').value
            });
            e.target.reset();
        });
    </script>
</body>
</html>
