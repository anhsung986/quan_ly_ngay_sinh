<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Sinh Nhật</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); min-height: 100vh; padding: 15px; }
        .container { max-width: 900px; margin: 0 auto; background: #ffffff; padding: 20px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; border-radius: 15px; text-align: center; margin-bottom: 20px; }
        .form-box { background: #f8fafc; padding: 15px; border-radius: 15px; margin-bottom: 20px; border: 2px solid #e2e8f0; display: flex; flex-direction: column; gap: 12px; }
        input { width: 100%; padding: 12px 15px; border: 2px solid #cbd5e1; border-radius: 10px; }
        .btn-add { background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%); color: white; border: none; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; min-width: 600px; }
        th { background: #667eea; color: white; padding: 10px; font-size: 12px; }
        td { padding: 10px; border-bottom: 1px solid #e2e8f0; font-size: 13px; text-align: center; }
        .status-badge { padding: 4px 8px; border-radius: 10px; font-weight: bold; font-size: 11px; }
        .btn-delete { background: #fee2e2; color: #ef4444; border: none; padding: 5px 10px; border-radius: 6px; cursor: pointer; }
        dialog { border: none; border-radius: 15px; padding: 20px; width: 85%; max-width: 320px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header"><h1>🎂 Quản Lý Sinh Nhật</h1></div>
        <form id="contactForm" class="form-box">
            <input type="text" id="name" placeholder="👤 Tên" required>
            <input type="text" id="phone" placeholder="📞 SĐT">
            <div style="font-size: 11px; font-weight:bold; color:#64748b;">📅 Ngày sinh</div>
            <input type="date" id="dob" required>
            <button type="submit" class="btn-add">THÊM MỚI ✨</button>
        </form>

        <div class="table-container">
            <table>
                <thead><tr><th>Tên</th><th>SĐT</th><th>Ngày sinh</th><th>Đếm ngược</th><th>Hành động</th></tr></thead>
                <tbody id="contactTableBody"></tbody>
            </table>
        </div>
    </div>

    <dialog id="passwordDialog">
        <h3>🔐 Xác nhận xóa</h3>
        <input type="password" id="passInput" placeholder="Nhập mật khẩu...">
        <div style="display:flex; gap:10px; justify-content: flex-end; margin-top:10px;">
            <button onclick="document.getElementById('passwordDialog').close()">Hủy</button>
            <button style="background:#ef4444; color:white;" onclick="confirmDelete()">Xóa</button>
        </div>
    </dialog>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const db = getDatabase(initializeApp({databaseURL: "https://kkkk-efe87-default-rtdb.asia-southeast1.firebasedatabase.app"}));
        let deleteId = null;

        onValue(ref(db, 'contacts'), (snapshot) => {
            const body = document.getElementById('contactTableBody');
            body.innerHTML = '';
            const data = snapshot.val() || {};
            const today = new Date();

            Object.entries(data).forEach(([id, val]) => {
                const bday = new Date(val.dob);
                let nextBday = new Date(today.getFullYear(), bday.getMonth(), bday.getDate());
                if (nextBday < today) nextBday.setFullYear(today.getFullYear() + 1);
                
                const diff = Math.ceil((nextBday - today) / (1000 * 60 * 60 * 24));
                const countdown = diff === 0 ? "🎉 HÔM NAY" : `Còn ${diff} ngày`;

                body.innerHTML += `<tr>
                    <td><b>${val.name}</b></td><td>${val.phone}</td><td>${val.dob}</td>
                    <td><span class="status-badge" style="background:${diff===0?'#fee2e2':'#dcfce7'}">${countdown}</span></td>
                    <td><button class="btn-delete" onclick="openDialog('${id}')">Xóa</button></td>
                </tr>`;
            });
        });

        window.openDialog = (id) => { deleteId = id; document.getElementById('passwordDialog').showModal(); }
        window.confirmDelete = async () => {
            if (document.getElementById('passInput').value === "1234567890") {
                await remove(ref(db, 'contacts/' + deleteId));
                document.getElementById('passwordDialog').close();
            } else alert("Sai mật khẩu!");
        };

        document.getElementById('contactForm').addEventListener('submit', (e) => {
            e.preventDefault();
            push(ref(db, 'contacts'), {
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                dob: document.getElementById('dob').value
            });
            e.target.reset();
        });
    </script>
</body>
</html>
