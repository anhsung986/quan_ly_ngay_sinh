<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Sinh Nhật</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: #ffffff; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 25px; border-radius: 15px; text-align: center; margin-bottom: 25px; }
        .form-box { background: #f8fafc; padding: 20px; border-radius: 15px; margin-bottom: 25px; border: 2px solid #e2e8f0; display: grid; grid-template-columns: 1fr; gap: 12px; }
        input { padding: 12px 15px; border: 2px solid #cbd5e1; border-radius: 10px; }
        .btn-add { background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%); color: white; border: none; padding: 12px; border-radius: 10px; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; border-bottom: 1px solid #e2e8f0; text-align: left; }
        .btn-delete { background: #fee2e2; color: #ef4444; border: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header"><h1>🎂 Quản Lý Sinh Nhật</h1></div>
        <form id="contactForm" class="form-box">
            <input type="text" id="name" placeholder="👤 Tên người đó" required>
            <input type="text" id="phone" placeholder="📞 Số điện thoại">
            <input type="date" id="dob" required>
            <button type="submit" class="btn-add">THÊM MỚI ✨</button>
        </form>

        <table id="contactTable">
            <thead><tr><th>Tên</th><th>SĐT</th><th>Ngày sinh</th><th>Hành động</th></tr></thead>
            <tbody id="contactTableBody"></tbody>
        </table>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://kkkk-efe87-default-rtdb.firebaseio.com/", // Đảm bảo URL này đúng của bạn
            projectId: "kkkk-efe87"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const contactsRef = ref(db, 'contacts');

        const form = document.getElementById('contactForm');
        const tableBody = document.getElementById('contactTableBody');

        // Lấy dữ liệu
        onValue(contactsRef, (snapshot) => {
            tableBody.innerHTML = '';
            const data = snapshot.val();
            if (data) {
                Object.entries(data).forEach(([id, val]) => {
                    tableBody.innerHTML += `<tr>
                        <td>${val.name}</td><td>${val.phone}</td><td>${val.dob}</td>
                        <td><button class="btn-delete" onclick="window.deleteData('${id}')">Xóa</button></td>
                    </tr>`;
                });
            }
        });

        // Thêm dữ liệu
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            push(contactsRef, {
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                dob: document.getElementById('dob').value
            });
            form.reset();
        });

        // Xóa dữ liệu với mật khẩu
        window.deleteData = (id) => {
            const pass = prompt("Nhập mật khẩu để xóa:");
            if (pass === "1234567890") {
                remove(ref(db, 'contacts/' + id));
            } else if (pass !== null) {
                alert("Sai mật khẩu!");
            }
        };
    </script>
</body>
</html>
